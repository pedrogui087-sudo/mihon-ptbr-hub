name: Build Mihon PT-BR Hub

on:
  workflow_dispatch:
  push:
    paths:
      - 'mihon-ptbr-hub-completo/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Baixar framework atual do Keiyoushi
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          path: upstream

      - name: Copiar nossa extensão para o framework
        run: |
          rm -rf upstream/src/pt/mihonptbrhub
          mkdir -p upstream/src/pt
          cp -R "mihon-ptbr-hub-completo/src/pt/mihonptbrhub" "upstream/src/pt/"

      - name: Formatar código
        working-directory: upstream
        run: ./gradlew :src:pt:mihonptbrhub:spotlessApply

      - name: Compilar extensão
        working-directory: upstream
        run: ./gradlew :src:pt:mihonptbrhub:assembleRelease --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: mihon-pt-br-hub-apk
          path: upstream/src/pt/mihonptbrhub/build/outputs/apk/release/*.apk
          if-no-files-found: error
